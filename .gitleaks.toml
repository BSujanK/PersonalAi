# Default gitleaks rules, plus one narrow allowlist: the shared approval-signature test
# vectors use a synthetic key (bytes 0x00..0x1f, base64url) that trips the generic-api-key
# rule. Only that exact value, in that exact file, is allowed. Any other secret in the same
# file, or this value anywhere else, is still reported. Never add real material here.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic approval key in the cross-language test vectors"
condition = "AND"
regexTarget = "secret"
regexes = ['''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8$''']
paths = ['''^shared/test-vectors/approval-signature\.json$''']
