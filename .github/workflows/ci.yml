name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml uses [[allowlists]] with condition = "AND" (gitleaks >= 8.25).
          GITLEAKS_VERSION: 8.28.0

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f server/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.present.outputs.yes == 'true'
        working-directory: server
        run: |
          uv sync --all-extras --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy agent
          uv run pytest -q

  # The server runs on the owner's Windows laptop, so the same checks run on Windows too:
  # PATH lookups, powercfg output, default text encodings (cp1252) and the OS keyring all
  # differ from Linux. Python 3.13 matches the laptop.
  server-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - working-directory: server
        run: |
          uv sync --all-extras --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy agent
          uv run pytest -q

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f mobile/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.present.outputs.yes == 'true'
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint .
          npx jest --ci

  # Compiles the native side (including the Kotlin bank-sms module) into a debug APK.
  # Debug builds are signed with the throwaway debug key Gradle generates on the runner;
  # no signing secrets or google-services.json are used, so push stays off in this APK.
  android:
    runs-on: ubuntu-latest
    needs: mobile
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prebuild
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install --clean
      # Release, not debug: a debug build is an Expo dev-client shell that loads JS from a Metro
      # server and cannot run on its own. The release APK bundles the JS. Expo's template signs
      # release with the template debug keystore, so it sideloads and updates in place; no
      # signing secrets are involved.
      - name: Assemble release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: personalai-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
