[project]
name = "personalai-agent"
version = "0.1.0"
description = "Private personal agent server"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "openai>=1.40,<2",
    "httpx",
    "cryptography",
    "keyring>=25",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "apscheduler>=3.10,<4",
    "pypdf>=6.19.0",
    "defusedxml>=0.7.1",
    "segno>=1.6.6",
]

[dependency-groups]
# httpx2: what starlette.testclient (TestClient) wants; with plain httpx it warns that this is
# deprecated and a later starlette may drop that fallback. Runtime code and the OpenAI SDK keep httpx.
dev = ["pytest", "ruff", "mypy", "httpx2>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail loudly if TestClient ever falls back to the deprecated httpx path again.
filterwarnings = ["error:Using .httpx. with .starlette.testclient. is deprecated"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "defusedxml.*", "google_auth_oauthlib.*", "apscheduler.*"]
ignore_missing_imports = true
